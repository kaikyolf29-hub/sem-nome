name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Instalar dependências
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Instalar Chromium
        run: bunx playwright install --with-deps chromium
      - name: Testes da coleta de notícias
        run: bun run test:coleta
        working-directory: .
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bun run orcamento
      - run: bun run build:prototipo
      - run: bun run test:e2e
